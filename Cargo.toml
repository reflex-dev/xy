# Workspace: the core stays the root package; `cascade` is the optional
# style-cascade extension (its own cdylib, loaded lazily and only when a
# native-cascade export is requested — the §33 install budget and the
# import-weight contract are measured with both, but the core never links it).
[workspace]
members = [".", "cascade"]
default-members = [".", "cascade"]

[package]
name = "xy-core"
version = "0.1.0"
edition = "2021"
description = "Native compute core for the xy engine: zone maps, offset-encoded f32, M4 decimation"
license = "Apache-2.0"

# The compute core remains exposed through a plain C ABI, so one cdylib per
# platform covers every CPython version. Static chart export uses the focused
# `png` crate's fdeflate fast path; compression belongs beside rasterization so
# the hot path never round-trips a full framebuffer through Python.
[lib]
name = "xy_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
png = "0.18.1"

# Whole-program optimization; `strip` keeps .dynsym, which ctypes binds
# against. `panic` must stay unwinding — lib.rs catches panics at the C ABI.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
