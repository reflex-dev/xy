channels:
  - conda-forge
dependencies:
  # Toolchain for the postBuild source install: the native Rust core and the
  # Node-built render client are hard requirements of a checkout install.
  # Loose version pins on purpose — exact conda build strings are
  # arch-specific (mybinder.org also schedules aarch64 nodes) and conda-forge
  # rebuilds retire them, which would quietly make this file unsolvable.
  - rust=1.88.*
  - nodejs=22.*
  # No python/pip pin: the wheel is ABI-agnostic (py3-none, ctypes C ABI), so
  # repo2docker's stock interpreter serves it as-is, and pinning below the
  # frozen base environment would force mamba to downgrade the interpreter
  # and churn the whole preinstalled Jupyter stack.
  #
  # The scientific stack imported across examples/**/*.ipynb — installing the
  # checkout itself brings only numpy + anywidget.
  - matplotlib
  - pandas
  - scipy
  - scikit-learn
  - seaborn
  - h5py
  - requests
  # Deliberately not provisioned: pysam (bioconda-only) and gwosc, each used
  # by single specialist notebooks under examples/real_world/; run
  # `%pip install pysam gwosc` in-notebook when needed.
