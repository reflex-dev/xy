name: Restore CI build
description: Reuse the native core and render client from this run's Linux wheel.
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ci-linux-wheel
        path: dist
    - shell: bash
      run: |
        python3 - <<'PY'
        from pathlib import Path
        from zipfile import ZipFile
        wheels = list(Path('dist').glob('*.whl'))
        assert len(wheels) == 1, wheels
        with ZipFile(wheels[0]) as wheel:
            for name in wheel.namelist():
                if name.startswith(('xy/_native_lib/', 'xy/static/')) and not name.endswith('/'):
                    destination = Path('python') / name
                    destination.parent.mkdir(parents=True, exist_ok=True)
                    destination.write_bytes(wheel.read(name))
        native = Path('python/xy/_native_lib/libxy_core.so')
        assert native.is_file()
        release = Path('target/release')
        release.mkdir(parents=True, exist_ok=True)
        (release / native.name).write_bytes(native.read_bytes())
        PY
        echo 'XY_SKIP_CARGO=1' >> "$GITHUB_ENV"
