name: Restore gallery system dependencies
description: Verify and install this run's pinned Ubuntu FFmpeg packages without package-server access.
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ci-gallery-ffmpeg
        path: dist/gallery-ffmpeg
    - shell: bash
      run: python3 scripts/ci_gallery_dependencies.py install
