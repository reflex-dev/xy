name: Release

# Publish prebuilt wheels + sdist to PyPI and GitHub Releases on a version tag.
# This is what makes `pip install xy` a no-toolchain install: each platform
# wheel carries the compiled Rust core, so end users never see Rust or Node.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: >-
          Dry run: build and verify every wheel/sdist/wasm artifact across the
          full release matrix without publishing to PyPI. Use this to validate
          the cross-compile matrix (musllinux, win-arm64, wasm, ...) before a
          real version-tag release. Defaults to true so a manual dispatch
          never accidentally publishes.
        type: boolean
        default: true

# Limit build jobs to repository reads. The publish job declares its separate
# OIDC-only token permissions below.
permissions:
  contents: read

jobs:
  # One wheel per platform (the C-ABI core is CPython-version-independent, so
  # each entry produces a single py3-none-<platform> wheel). Coverage matches
  # what the native core can target: Linux glibc + musl across x86-64/aarch64/
  # armv7, macOS x86-64/arm64, and Windows x86/x64/arm64. Linux targets are
  # cross-compiled with cargo-zigbuild (musl support + a low manylinux_2_17
  # glibc floor without QEMU); the hook then packs the prebuilt core and stamps
  # the platform tag (XY_CARGO_TARGET / XY_WHEEL_PLATFORM).
  wheels:
    name: Wheel ${{ matrix.plat }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux glibc (manylinux_2_17 floor) — cross-compiled with zig.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, zigtarget: x86_64-unknown-linux-gnu.2.17, plat: manylinux_2_17_x86_64, zig: true, native: true }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, zigtarget: aarch64-unknown-linux-gnu.2.17, plat: manylinux_2_17_aarch64, zig: true, native: false }
          - { os: ubuntu-latest, target: armv7-unknown-linux-gnueabihf, zigtarget: armv7-unknown-linux-gnueabihf.2.17, plat: manylinux_2_17_armv7l, zig: true, native: false }
          # Linux musl / Alpine. crt-static is musl's default, and rustc
          # silently *drops* cdylib output under it (a warning, not an error)
          # since a fully-static binary can't also be a shared library —
          # -C target-feature=-crt-static switches to dynamic linking against
          # musl libc so a real cdylib gets produced.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, zigtarget: x86_64-unknown-linux-musl, plat: musllinux_1_2_x86_64, zig: true, native: false, rustflags: "-C target-feature=-crt-static" }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, zigtarget: aarch64-unknown-linux-musl, plat: musllinux_1_2_aarch64, zig: true, native: false, rustflags: "-C target-feature=-crt-static" }
          - { os: ubuntu-latest, target: armv7-unknown-linux-musleabihf, zigtarget: armv7-unknown-linux-musleabihf, plat: musllinux_1_2_armv7l, zig: true, native: false, rustflags: "-C target-feature=-crt-static" }
          # macOS. Both build on the arm64 runner (macos-14): Apple Silicon
          # runners are plentiful, while the last Intel runner (macos-13) is
          # deprecated and frequently unschedulable. The Apple toolchain
          # cross-links x86_64 Mach-O natively, so the Intel wheel is a cross
          # build (native: false -> content-verified, not import-smoked, since
          # an x86_64 lib can't be imported on the arm64 runner).
          - { os: macos-14, target: x86_64-apple-darwin, plat: macosx_10_12_x86_64, zig: false, native: false, deployment: "10.12" }
          - { os: macos-14, target: aarch64-apple-darwin, plat: macosx_11_0_arm64, zig: false, native: true, deployment: "11.0" }
          # Windows x64 (native), x86 and arm64 (cross-compiled).
          - { os: windows-latest, target: x86_64-pc-windows-msvc, plat: win_amd64, zig: false, native: true }
          - { os: windows-latest, target: i686-pc-windows-msvc, plat: win32, zig: false, native: false }
          - { os: windows-latest, target: aarch64-pc-windows-msvc, plat: win_arm64, zig: false, native: false }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags: the distribution version is derived
          # from the latest `v*` tag, and a shallow clone has none.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install JS build toolchain
        run: npm ci
      - name: Cross-compile the native core (zig)
        if: matrix.zig
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: |
          uv tool install cargo-zigbuild
          uv tool run cargo-zigbuild build --release --target ${{ matrix.zigtarget }}
      - name: Compile the native core
        if: ${{ !matrix.zig }}
        env:
          # macOS min-version floor for the produced Mach-O; empty (Windows
          # entries have no deployment key) is ignored by the MSVC toolchain.
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment }}
        run: cargo build --release --target ${{ matrix.target }}
      - name: Build the platform wheel
        shell: bash
        env:
          # The core is prebuilt above; the hook packs it and stamps the
          # platform tag, and builds the render client (node) into the wheel.
          # The client is required by default; REQUIRE_CARGO also forbids the
          # core from silently going missing.
          XY_REQUIRE_CARGO: "1"
          XY_SKIP_CARGO: "1"
          XY_CARGO_TARGET: ${{ matrix.target }}
          XY_WHEEL_PLATFORM: ${{ matrix.plat }}
        run: uv build --wheel
      - name: Verify wheel contents
        shell: bash
        run: |
          whl=$(ls dist/*.whl)
          python scripts/verify_wheel.py "$whl" --expect-native
      - name: Install-size budget (<= 15 MB)
        shell: bash
        run: |
          whl=$(ls dist/*.whl)
          size=$(wc -c < "$whl" | tr -d ' ')
          echo "wheel size: $size bytes ($whl)"
          test "$size" -le 15728640
      - name: Verify the wheel installs and loads the native core
        # Only host-arch wheels can be imported on the runner; cross-compiled
        # arches (aarch64/armv7/win-arm64/win32) are content-verified instead.
        if: matrix.native
        shell: bash
        run: |
          uv venv smoke
          uv pip install -p smoke dist/*.whl numpy anywidget
          ./smoke/bin/python -c "import xy.kernels as k; assert k.BACKEND=='native', k.BACKEND; print('native', k.__file__)" \
            || ./smoke/Scripts/python.exe -c "import xy.kernels as k; assert k.BACKEND=='native', k.BACKEND; print('native')"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.plat }}
          path: dist/*.whl

  # PyEmscripten WASM wheel for in-browser CPython. The platform ABI is
  # compiler-sensitive, so keep Rust, Emscripten, cibuildwheel, the wheel tag,
  # and the runtime probe pinned as one tested set
  # (see spec/process/production-readiness.md).
  wasm:
    name: Wheel PyEmscripten (runtime verified)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags: the distribution version is derived
          # from the latest `v*` tag, and a shallow clone has none.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.97.0
          targets: wasm32-unknown-emscripten
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install JS build toolchain
        run: npm ci
      # cibuildwheel installs the Pyodide 314 cross-environment and its patched
      # Emscripten 5.0.3 toolchain before CIBW_BEFORE_BUILD_PYODIDE runs. Build
      # the standalone Rust cdylib there, then tell the Hatch hook to package
      # that prebuilt artifact rather than invoke Cargo a second time.
      - name: Build the PyEmscripten wheel
        uses: pypa/cibuildwheel@294735312765b09d24a2fbec22660ce817587d55 # v4.1.0
        env:
          CIBW_PLATFORM: pyodide
          CIBW_BUILD: cp314-pyodide_wasm32
          CIBW_PYODIDE_VERSION: "314.0.0"
          CIBW_BEFORE_BUILD_PYODIDE: >-
            cargo build --release --target wasm32-unknown-emscripten
          CIBW_ENVIRONMENT_PYODIDE: >-
            XY_REQUIRE_CARGO=1
            XY_SKIP_CARGO=1
            XY_CARGO_TARGET=wasm32-unknown-emscripten
            XY_WHEEL_PLATFORM=pyemscripten_2026_0_wasm32
            RUSTFLAGS="-C panic=abort"
      - name: Verify wheel contents
        shell: bash
        run: |
          whl=$(ls wheelhouse/*.whl)
          python scripts/verify_wheel.py "$whl" --expect-native
      # "Builds" is not "loads": install the exact wheel in a real Pyodide 314
      # runtime and call both the C ABI version function and a native kernel.
      - name: PyEmscripten runtime load probe
        run: |
          npm i --no-save pyodide@314.0.0
          whl=$(ls wheelhouse/*.whl)
          python scripts/pyodide_load_smoke.py "$whl"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # PEP 783 makes pyemscripten_* a standard PyPI platform tag. Keeping
          # this in the dist-* namespace includes it in the trusted-publishing
          # batch alongside the native wheels and sdist.
          name: dist-pyemscripten
          path: wheelhouse/*.whl

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags: the distribution version is derived
          # from the latest `v*` tag, and a shallow clone has none.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      # The build hook builds the render client (node) into the sdist, so
      # `pip install <sdist>` needs no Node. It builds the Rust core on the
      # user's machine if they have a toolchain; without one the compute layer
      # raises a clear ImportError on first use (hatch_build.py). Wheels are the
      # normal path.
      - name: Install JS build toolchain
        run: npm ci
      - name: Build sdist
        # The client is required by default, so a published sdist always carries
        # the prebuilt render client (the build fails otherwise).
        run: uv build --sdist
      - name: Verify sdist contents
        shell: bash
        run: |
          sdist=$(ls dist/*.tar.gz)
          python scripts/verify_sdist.py "$sdist"
      - name: Verify sdist without Rust errors clearly on import
        shell: bash
        env:
          XY_SKIP_CARGO: "1"
        run: |
          uv venv smoke
          uv pip install -p smoke dist/*.tar.gz numpy anywidget
          ./smoke/bin/python - <<'PY'
          # No native core and no fallback: the compute layer must raise a
          # clear, actionable error (§33: no-wheel behavior is defined).
          import xy

          assert xy.__version__
          try:
              import xy.kernels  # noqa: F401
          except ImportError as err:
              msg = str(err)
              assert "native Rust core" in msg, msg
              assert "rustup.rs" in msg, msg
              print("sdist without Rust errors clearly on import")
          else:
              raise SystemExit("expected ImportError without the native core")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    # Publishing requires the runtime-verified PyEmscripten job to pass. Its
    # PEP 783 wheel uses a standard PyPI platform tag and joins the same
    # trusted-publishing batch as the native wheels and sdist.
    needs: [wheels, sdist, wasm]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing (OIDC) — no API token stored
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags: the distribution version is derived
          # from the latest `v*` tag, and a shallow clone has none.
          fetch-depth: 0
      # The tag now *is* the version (pyproject derives it), so there is no
      # second number left to disagree with it. What a tag can't vouch for is
      # that the release was written up: this gate requires the tag to be shaped
      # like a release tag and CHANGELOG.md to carry a dated entry for it.
      - name: Release version gate (tag == CHANGELOG)
        if: github.event_name == 'push'
        run: python3 scripts/check_release_version.py
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - name: List artifacts
        run: ls -la dist/
      # A manual workflow_dispatch defaults to dry_run=true: every wheel/sdist/
      # wasm artifact is built and verified above, but nothing is uploaded to
      # PyPI. Use this to validate the full cross-compile matrix before a real
      # version-tag release. A tag push always publishes for real.
      - name: Dry run summary (no PyPI publish)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true'
        run: |
          echo "::notice::Dry run — built and verified $(ls dist/*.whl dist/*.tar.gz 2>/dev/null | wc -l | tr -d ' ') artifacts across the full release matrix. Skipping PyPI publish."
          echo "Re-run this workflow with dry_run=false, or push a v* tag, to publish for real."
      - name: Verify release tag source before PyPI
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! tag_source_sha="$(
            timeout --signal=TERM --kill-after=5s 30s \
              gh api "repos/${REPO}/commits/${TAG}" --jq '.sha'
          )"; then
            echo "::error::Could not resolve ${TAG} to its source commit"
            exit 1
          fi
          if [[ "$tag_source_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::${TAG} resolves to ${tag_source_sha}, not workflow source ${GITHUB_SHA}"
            exit 1
          fi
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true'
        with:
          packages-dir: dist/
          # A failed upload can leave a partial release on immutable PyPI.
          # Retrying the same tag should skip files that were already accepted.
          skip-existing: true

  github-release:
    name: Publish GitHub Release
    # GitHub Releases are a tag-push side effect only. In particular, neither
    # the default dry run nor a manually requested PyPI publish may create one.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Keep repository write access out of every build and PyPI job.
      contents: write
      # Sign a manifest that binds the generated notes and every distribution
      # byte to this exact tag workflow.
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - name: Inspect existing release
        id: release_state
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          immutable=false
          if release_json="$(
            timeout --signal=TERM --kill-after=5s 30s \
              gh release view "$TAG" \
                --repo "$REPO" \
                --json isImmutable \
                2>/dev/null
          )" && [[ "$(jq -r '.isImmutable' <<<"$release_json")" == "true" ]]; then
            immutable=true
          fi
          echo "immutable=${immutable}" >> "$GITHUB_OUTPUT"

      - name: Prepare release provenance
        if: steps.release_state.outputs.immutable != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          artifacts=("${wheels[@]}" "${sdists[@]}")
          if (( ${#wheels[@]} == 0 || ${#sdists[@]} != 1 )); then
            echo "::error::Expected at least one wheel and exactly one sdist"
            exit 1
          fi

          distributions_json="$(
            for artifact in "${artifacts[@]}"; do
              artifact_sha256="$(sha256sum "$artifact" | cut -d ' ' -f 1)"
              jq -cn \
                --arg name "${artifact##*/}" \
                --arg sha256 "$artifact_sha256" \
                '{name: $name, sha256: $sha256}'
            done | jq -sc 'sort_by(.name)'
          )"
          if ! jq -e \
            'length > 1 and
             ([.[].name] | length) == ([.[].name] | unique | length) and
             all(.[]; .sha256 | test("^[0-9a-f]{64}$"))' \
            <<<"$distributions_json" >/dev/null; then
            echo "::error::Distribution names or SHA-256 digests are invalid"
            exit 1
          fi

          # Refuse to mint an attestation until both the mutable tag and
          # PyPI's immutable file set agree with this workflow run.
          verify_tag_source() {
            local tag_source_sha
            if ! tag_source_sha="$(
              timeout --signal=TERM --kill-after=5s 30s \
                gh api "repos/${REPO}/commits/${TAG}" --jq '.sha'
            )"; then
              echo "::error::Could not resolve ${TAG} to its source commit"
              return 1
            fi
            if [[ "$tag_source_sha" != "$GITHUB_SHA" ]]; then
              echo "::error::${TAG} resolves to ${tag_source_sha}, not workflow source ${GITHUB_SHA}"
              return 1
            fi
          }
          verify_tag_source

          pypi_version="${TAG#v}"
          pypi_matches=false
          for attempt in $(seq 1 12); do
            if pypi_json="$(
              curl -fsS \
                --connect-timeout 5 \
                --max-time 20 \
                "https://pypi.org/pypi/xy/${pypi_version}/json" \
                2>/dev/null
            )"; then
              if pypi_hashes_json="$(
                   jq -c \
                     '[.urls[] |
                       {name: .filename, sha256: .digests.sha256}] |
                      sort_by(.name)' \
                     <<<"$pypi_json"
                 )" &&
                 jq -e \
                   '(.urls | length > 1) and
                    all(.urls[];
                      .yanked == false and
                      (.filename |
                        endswith(".whl") or endswith(".tar.gz")) and
                      (.digests.sha256 |
                        type == "string" and
                        test("^[0-9a-f]{64}$")))' \
                   <<<"$pypi_json" >/dev/null &&
                 [[ "$pypi_hashes_json" == "$distributions_json" ]]; then
                pypi_matches=true
                break
              fi
            fi
            if (( attempt < 12 )); then
              echo "attempt ${attempt}/12 — waiting for exact, non-yanked PyPI files before attestation"
              sleep 10
            fi
          done
          if [[ "$pypi_matches" != true ]]; then
            echo "::error::PyPI files for ${TAG} do not exactly match the verified build"
            exit 1
          fi

          notes_file="${RUNNER_TEMP}/xy-${TAG}-release-notes.md"
          timeout --signal=TERM --kill-after=5s 30s \
            gh api \
              --method POST \
              "repos/${REPO}/releases/generate-notes" \
              -f tag_name="$TAG" \
              --jq '.body' > "$notes_file"
          generated_notes="$(<"$notes_file")"
          if [[ -z "${generated_notes//[[:space:]]/}" ]]; then
            echo "::error::GitHub generated empty release notes for ${TAG}"
            exit 1
          fi
          notes_sha256="$(
            printf '%s' "$generated_notes" | sha256sum | cut -d ' ' -f 1
          )"

          provenance_dir="${RUNNER_TEMP}/xy-${TAG}-release-provenance"
          mkdir -p "$provenance_dir"
          provenance_file="${provenance_dir}/xy-release-provenance.json"
          jq -cS -n \
            --arg schema "xy-release-provenance/v1" \
            --arg tag "$TAG" \
            --arg source_sha "$GITHUB_SHA" \
            --arg release_notes_sha256 "$notes_sha256" \
            --argjson distributions "$distributions_json" \
            '{
              schema: $schema,
              tag: $tag,
              source_sha: $source_sha,
              release_notes_sha256: $release_notes_sha256,
              distributions: $distributions
            }' > "$provenance_file"
          provenance_sha256="$(
            sha256sum "$provenance_file" | cut -d ' ' -f 1
          )"
          printf '%s\n\n<!-- xy-release-provenance:v1:%s:sha256:%s -->\n' \
            "$generated_notes" "$TAG" "$provenance_sha256" > "$notes_file"
          # Close the tag-movement window before the immediately following
          # attestation action persists a signature for this manifest.
          verify_tag_source

      - name: Attest release provenance
        if: steps.release_state.outputs.immutable != 'true'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ${{ runner.temp }}/xy-${{ github.ref_name }}-release-provenance/xy-release-provenance.json

      - name: Create GitHub Release and attach distributions
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          artifacts=("${wheels[@]}" "${sdists[@]}")
          if (( ${#wheels[@]} == 0 || ${#sdists[@]} != 1 )); then
            echo "::error::Expected at least one wheel and exactly one sdist"
            exit 1
          fi

          verify_tag_source() {
            local tag_source_sha
            if ! tag_source_sha="$(
              timeout --signal=TERM --kill-after=5s 30s \
                gh api "repos/${REPO}/commits/${TAG}" --jq '.sha'
            )"; then
              echo "::error::Could not resolve ${TAG} to its source commit"
              return 1
            fi
            if [[ "$tag_source_sha" != "$GITHUB_SHA" ]]; then
              echo "::error::${TAG} resolves to ${tag_source_sha}, not workflow source ${GITHUB_SHA}"
              return 1
            fi
          }
          verify_tag_source

          # Read the release before selecting the PyPI comparison source. An
          # immutable release is already bound to its signed persisted
          # manifest, so a same-source rebuild need not reproduce archive bytes
          # exactly. Mutable and new releases still have to match this run's
          # verified artifacts before any release write.
          release_exists=false
          release_json=""
          is_immutable=false
          if release_json="$(
            timeout --signal=TERM --kill-after=5s 30s \
              gh release view "$TAG" \
                --repo "$REPO" \
                --json assets,body,isDraft,isImmutable,isPrerelease,name,publishedAt,tagName \
                2>/dev/null
          )"; then
            release_exists=true
            is_immutable="$(jq -r '.isImmutable' <<<"$release_json")"
          fi

          provenance_name="xy-release-provenance.json"
          provenance_file="${RUNNER_TEMP}/xy-${TAG}-release-provenance/${provenance_name}"
          notes_file="${RUNNER_TEMP}/xy-${TAG}-release-notes.md"

          expected_assets_json="$(
            printf '%s\n' "${artifacts[@]##*/}" |
              jq -Rsc 'split("\n") | map(select(length > 0)) | sort'
          )"
          expected_hashes_json="$(
            for artifact in "${artifacts[@]}"; do
              artifact_sha256="$(sha256sum "$artifact" | cut -d ' ' -f 1)"
              jq -cn \
                --arg name "${artifact##*/}" \
                --arg sha256 "$artifact_sha256" \
                '{name: $name, sha256: $sha256}'
            done | jq -sc 'sort_by(.name)'
          )"

          # PyPI filenames are immutable. A retry may rebuild the same version
          # after some files were already accepted by `skip-existing`; never
          # clobber GitHub with candidate bytes that differ from those users
          # can install. Poll briefly for PyPI's API cache to expose the full
          # set after the publish job completes.
          pypi_version="${TAG#v}"
          pypi_matches=false
          for attempt in $(seq 1 12); do
            if pypi_json="$(
              curl -fsS \
                --connect-timeout 5 \
                --max-time 20 \
                "https://pypi.org/pypi/xy/${pypi_version}/json" \
                2>/dev/null
            )"; then
              if pypi_hashes_json="$(
                   jq -c \
                     '[.urls[] |
                       {name: .filename, sha256: .digests.sha256}] |
                      sort_by(.name)' \
                     <<<"$pypi_json"
                 )" &&
                 jq -e \
                   '(.urls | length > 1) and
                    all(.urls[];
                      .yanked == false and
                      (.filename |
                        endswith(".whl") or endswith(".tar.gz")) and
                      (.digests.sha256 |
                        type == "string" and
                        test("^[0-9a-f]{64}$")))' \
                   <<<"$pypi_json" >/dev/null; then
                if [[ "$is_immutable" == true || "$pypi_hashes_json" == "$expected_hashes_json" ]]; then
                  pypi_matches=true
                  break
                fi
              fi
            fi
            if (( attempt < 12 )); then
              echo "attempt ${attempt}/12 — waiting for exact, non-yanked PyPI files"
              sleep 10
            fi
          done
          if [[ "$pypi_matches" != true ]]; then
            echo "::error::PyPI files for ${TAG} do not exactly match the verified build"
            exit 1
          fi

          prerelease=()
          edit_prerelease=(--prerelease=false)
          expected_prerelease=false
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(a|b|rc)[0-9]+$ ]]; then
            prerelease=(--prerelease)
            edit_prerelease=(--prerelease)
            expected_prerelease=true
          fi

          release_metadata_matches() {
            local release_json="$1"
            jq -e \
              --arg name "$TAG" \
              --argjson prerelease "$expected_prerelease" \
              '.isDraft == false and
               .name == $name and
               .tagName == $name and
               .publishedAt != null and
               .isPrerelease == $prerelease' \
              <<<"$release_json" >/dev/null
          }

          verify_release_payload() {
            local release_json="$1"
            local reference_hashes_json="$2"
            local actual_assets_json
            local actual_hashes_json
            local actual_notes_sha256
            local footer
            local manifest_hashes_json
            local manifest_notes_sha256
            local manifest_sha256
            local notes_body
            local reference_assets_json
            local release_notes
            local verify_dir
            local verified_provenance

            reference_assets_json="$(
              jq -c '[.[].name] | sort' <<<"$reference_hashes_json"
            )"
            actual_assets_json="$(
              jq -c \
                '[.assets[]?.name |
                  select(endswith(".whl") or endswith(".tar.gz"))] | sort' \
                <<<"$release_json"
            )"
            if [[ "$actual_assets_json" != "$reference_assets_json" ]] ||
               ! jq -e --arg name "$provenance_name" \
                 '[.assets[]? | select(.name == $name)] | length == 1' \
                 <<<"$release_json" >/dev/null; then
              echo "::error::${TAG} release asset names do not match the trusted distribution set"
              return 1
            fi

            verify_dir="$(mktemp -d "${RUNNER_TEMP}/xy-release-verify.XXXXXX")"
            if ! timeout --signal=TERM --kill-after=5s 180s \
              gh release download "$TAG" \
                --repo "$REPO" \
                --dir "$verify_dir" \
                --pattern '*.whl' \
                --pattern '*.tar.gz' \
                --pattern "$provenance_name"; then
              echo "::error::Could not download ${TAG} release assets for verification"
              return 1
            fi
            verified_provenance="${verify_dir}/${provenance_name}"
            if [[ ! -s "$verified_provenance" ]]; then
              echo "::error::${TAG} release provenance asset is missing or empty"
              return 1
            fi

            if ! timeout --signal=TERM --kill-after=5s 60s \
              gh attestation verify "$verified_provenance" \
                --repo "$REPO" \
                --signer-workflow "${REPO}/.github/workflows/release.yml" \
                --source-ref "refs/tags/${TAG}" \
                --source-digest "$GITHUB_SHA" \
                --deny-self-hosted-runners >/dev/null; then
              echo "::error::${TAG} release provenance was not signed by this tag workflow"
              return 1
            fi
            if ! jq -e \
              --arg tag "$TAG" \
              --arg source_sha "$GITHUB_SHA" \
              '.schema == "xy-release-provenance/v1" and
               .tag == $tag and
               .source_sha == $source_sha and
               (.release_notes_sha256 | test("^[0-9a-f]{64}$")) and
               (.distributions | type == "array" and length > 1) and
               ([.distributions[].name] | length) ==
                 ([.distributions[].name] | unique | length) and
               all(.distributions[];
                 (.name | endswith(".whl") or endswith(".tar.gz")) and
                 (.sha256 | test("^[0-9a-f]{64}$")))' \
              "$verified_provenance" >/dev/null; then
              echo "::error::${TAG} release provenance content is invalid"
              return 1
            fi

            actual_hashes_json="$(
              for artifact in "$verify_dir"/*.whl "$verify_dir"/*.tar.gz; do
                artifact_sha256="$(sha256sum "$artifact" | cut -d ' ' -f 1)"
                jq -cn \
                  --arg name "${artifact##*/}" \
                  --arg sha256 "$artifact_sha256" \
                  '{name: $name, sha256: $sha256}'
              done | jq -sc 'sort_by(.name)'
            )"
            manifest_hashes_json="$(
              jq -c \
                '[.distributions[] | {name, sha256}] | sort_by(.name)' \
                "$verified_provenance"
            )"
            if [[ "$actual_hashes_json" != "$reference_hashes_json" ||
                  "$manifest_hashes_json" != "$reference_hashes_json" ]]; then
              echo "::error::${TAG} release bytes do not match the trusted distribution set"
              return 1
            fi

            manifest_sha256="$(
              sha256sum "$verified_provenance" | cut -d ' ' -f 1
            )"
            footer="<!-- xy-release-provenance:v1:${TAG}:sha256:${manifest_sha256} -->"
            release_notes="$(jq -r '.body // ""' <<<"$release_json")"
            if [[ "$release_notes" != *$'\n\n'"$footer" ]]; then
              echo "::error::${TAG} release notes are not bound to the signed provenance"
              return 1
            fi
            notes_body="${release_notes%$'\n\n'"$footer"}"
            actual_notes_sha256="$(
              printf '%s' "$notes_body" | sha256sum | cut -d ' ' -f 1
            )"
            manifest_notes_sha256="$(
              jq -r '.release_notes_sha256' "$verified_provenance"
            )"
            if [[ "$actual_notes_sha256" != "$manifest_notes_sha256" ]]; then
              echo "::error::${TAG} release notes differ from the signed generated notes"
              return 1
            fi
          }

          # `gh release create` publishes immediately. If a previous run made
          # the release but failed partway through uploading assets, refresh
          # the verified files instead of failing an otherwise safe retry. A
          # manually created draft or mismatched prerelease is normalized and
          # then re-read before docs promotion is allowed to observe it.
          if [[ "$release_exists" == true ]]; then
            if [[ "$is_immutable" == "true" ]]; then
              # GitHub's generated-note inputs can change after publication.
              # Verify the persisted body against its signed manifest instead
              # of comparing it with freshly regenerated notes or rebuilt
              # archive bytes.
              if release_metadata_matches "$release_json" &&
                 verify_release_payload "$release_json" "$pypi_hashes_json"; then
                verify_tag_source
                echo "::notice::${TAG} is immutable and already matches the verified release"
                exit 0
              fi
              echo "::error::${TAG} is immutable but does not match the verified release"
              exit 1
            fi

            if [[ ! -s "$provenance_file" || ! -s "$notes_file" ]]; then
              echo "::error::Prepared release notes or provenance are missing"
              exit 1
            fi
            echo "::notice::${TAG} already exists; refreshing distribution assets"
            verify_tag_source
            gh release upload "$TAG" "${artifacts[@]}" "$provenance_file" --repo "$REPO" --clobber
            release_json="$(
              timeout --signal=TERM --kill-after=5s 30s \
                gh release view "$TAG" \
                  --repo "$REPO" \
                  --json assets,body,isDraft,isImmutable,isPrerelease,name,publishedAt,tagName
            )"

            while IFS= read -r asset_json; do
              asset_name="$(jq -r '.name' <<<"$asset_json")"
              if ! jq -e --arg name "$asset_name" \
                'index($name) != null' <<<"$expected_assets_json" >/dev/null; then
                asset_id="$(jq -r '.apiUrl | split("/")[-1]' <<<"$asset_json")"
                if [[ ! "$asset_id" =~ ^[0-9]+$ ]]; then
                  echo "::error::Invalid GitHub asset id for ${asset_name}"
                  exit 1
                fi
                echo "::notice::Removing stale distribution asset ${asset_name}"
                verify_tag_source
                gh api \
                  --method DELETE \
                  "repos/${REPO}/releases/assets/${asset_id}"
              fi
            done < <(
              jq -c \
                '.assets[] | select(.name | endswith(".whl") or endswith(".tar.gz"))' \
                <<<"$release_json"
            )

            echo "::notice::Normalizing ${TAG} metadata and generated notes"
            verify_tag_source
            gh release edit "$TAG" \
              --repo "$REPO" \
              --draft=false \
              --title "$TAG" \
              --notes-file "$notes_file" \
              "${edit_prerelease[@]}"

            release_json="$(
              timeout --signal=TERM --kill-after=5s 30s \
                gh release view "$TAG" \
                  --repo "$REPO" \
                  --json assets,body,isDraft,isImmutable,isPrerelease,name,publishedAt,tagName
            )"
            if ! release_metadata_matches "$release_json" ||
               ! verify_release_payload "$release_json" "$expected_hashes_json"; then
              echo "::error::${TAG} release metadata, notes, or assets are invalid after normalization"
              exit 1
            fi

            verify_tag_source
            exit 0
          fi

          if [[ ! -s "$provenance_file" || ! -s "$notes_file" ]]; then
            echo "::error::Prepared release notes or provenance are missing"
            exit 1
          fi
          verify_tag_source
          gh release create "$TAG" "${artifacts[@]}" "$provenance_file" --repo "$REPO" --verify-tag --title "$TAG" --notes-file "$notes_file" "${prerelease[@]}"
          release_json="$(
            timeout --signal=TERM --kill-after=5s 30s \
              gh release view "$TAG" \
                --repo "$REPO" \
                --json assets,body,isDraft,isImmutable,isPrerelease,name,publishedAt,tagName
          )"
          if ! release_metadata_matches "$release_json" ||
             ! verify_release_payload "$release_json" "$expected_hashes_json"; then
            echo "::error::${TAG} release metadata, notes, or assets are invalid after creation"
            exit 1
          fi
          verify_tag_source
