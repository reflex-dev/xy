# Builds every artifact an `xy` release publishes: eleven cross-compiled platform
# wheels, a runtime-verified PyEmscripten wheel and an sdist. No single runner can
# produce that set, which is why this is a repository-supplied build workflow
# rather than the `uv build` the release pipeline runs by default.
#
# reflex-release's publish.yml calls this in place of its own build job — see
# `[[tool.reflex-release.custom-build]]` in pyproject.toml — and keeps everything
# either side: `prepare` has already validated the request against CHANGELOG.md,
# the branch rules and the existing tags, and `collect` verifies every file here
# is `xy` at `version`, requires the full set (`expect-artifacts`), and writes the
# checksum manifest the approver sees. So this workflow's whole job is to build
# and upload; it never publishes, tags, or holds a credential.
#
# Four rules from the contract (reflex-release README § Custom builds), all
# load-bearing:
#   1. every artifact is named `<artifact-prefix><leg>` — anything else is not
#      collected, and therefore not published;
#   2. upload distribution files only, since every collected file goes to PyPI;
#   3. tag the checkout with `tag` so the artifacts carry the released version;
#   4. let failures fail — no `continue-on-error`, because a lost matrix leg must
#      stop the release rather than ship an incomplete set.
name: Build release artifacts

on:
  workflow_call:
    inputs:
      package:
        description: "Package being built"
        required: true
        type: string
      version:
        description: "Version being released (no v prefix)"
        required: true
        type: string
      tag:
        description: "Tag the checkout with this so the build derives that version"
        required: true
        type: string
      build-dir:
        description: "Repo-relative directory of the package"
        required: true
        type: string
      artifact-prefix:
        description: "Name every uploaded artifact <artifact-prefix><leg>"
        required: true
        type: string
  # Dry run: build and verify the full matrix without a release. Use it to
  # exercise the cross-compile legs (musllinux, win-arm64, wasm, ...) after
  # touching the matrix, the toolchains or the wheel tags — a target added but
  # never exercised is unverified, not working. Nothing here can publish: the
  # upload path lives in publish.yml, which this workflow never calls.
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Optional release tag to build at (e.g. v0.1.0). Empty builds at the
          derived <next>.devN+<commit> version, which PyPI rejects by design.
        required: false
        default: ""
      artifact-prefix:
        description: "Prefix for the uploaded artifact names"
        required: false
        default: "dry-run--"

# Builds read the repository and nothing else. A called workflow cannot hold more
# privilege than the calling job grants it, so this is inside the same
# unprivileged boundary as the pipeline's own build job.
permissions:
  contents: read

jobs:
  # The changelog decides *which* version ships and `collect` proves the built
  # artifacts carry it; this decides that the tag recording it is a shape
  # uv-dynamic-versioning can derive that version from. It gates the matrix
  # rather than following it, because the cross-compile legs are slow.
  version-gate:
    name: Release version gate (tag shape)
    runs-on: ubuntu-latest
    steps:
      # Shallow on purpose: this reads one stdlib script, no git history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job here needs git write access: `git tag` works on a
          # credential-free checkout and publish.yml pushes the tag later. Not
          # persisting the token keeps it out of a workspace that then runs
          # third-party build code.
          persist-credentials: false
      - name: Check the tag is a shape the version derivation accepts
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
        run: python3 scripts/check_release_version.py --tag "$TAG"

  wheels:
    name: Wheel ${{ matrix.plat }}
    needs: version-gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux glibc (manylinux_2_17 floor) — cross-compiled with zig.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, zigtarget: x86_64-unknown-linux-gnu.2.17, plat: manylinux_2_17_x86_64, zig: true, native: true }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, zigtarget: aarch64-unknown-linux-gnu.2.17, plat: manylinux_2_17_aarch64, zig: true, native: false }
          - { os: ubuntu-latest, target: armv7-unknown-linux-gnueabihf, zigtarget: armv7-unknown-linux-gnueabihf.2.17, plat: manylinux_2_17_armv7l, zig: true, native: false }
          # Linux musl / Alpine. crt-static is musl's default, and rustc
          # silently *drops* cdylib output under it (a warning, not an error)
          # since a fully-static binary can't also be a shared library —
          # -C target-feature=-crt-static switches to dynamic linking against
          # musl libc so a real cdylib gets produced.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, zigtarget: x86_64-unknown-linux-musl, plat: musllinux_1_2_x86_64, zig: true, native: false, rustflags: "-C target-feature=-crt-static" }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, zigtarget: aarch64-unknown-linux-musl, plat: musllinux_1_2_aarch64, zig: true, native: false, rustflags: "-C target-feature=-crt-static" }
          - { os: ubuntu-latest, target: armv7-unknown-linux-musleabihf, zigtarget: armv7-unknown-linux-musleabihf, plat: musllinux_1_2_armv7l, zig: true, native: false, rustflags: "-C target-feature=-crt-static" }
          # macOS. Both build on the arm64 runner (macos-14): Apple Silicon
          # runners are plentiful, while the last Intel runner (macos-13) is
          # deprecated and frequently unschedulable. The Apple toolchain
          # cross-links x86_64 Mach-O natively, so the Intel wheel is a cross
          # build (native: false -> content-verified, not import-smoked, since
          # an x86_64 lib can't be imported on the arm64 runner).
          - { os: macos-14, target: x86_64-apple-darwin, plat: macosx_10_12_x86_64, zig: false, native: false, deployment: "10.12" }
          - { os: macos-14, target: aarch64-apple-darwin, plat: macosx_11_0_arm64, zig: false, native: true, deployment: "11.0" }
          # Windows x64 (native), x86 and arm64 (cross-compiled).
          - { os: windows-latest, target: x86_64-pc-windows-msvc, plat: win_amd64, zig: false, native: true }
          - { os: windows-latest, target: i686-pc-windows-msvc, plat: win32, zig: false, native: false }
          - { os: windows-latest, target: aarch64-pc-windows-msvc, plat: win_arm64, zig: false, native: false }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags: the distribution version is derived from the
          # latest `v*` tag, and a shallow clone has none.
          fetch-depth: 0
          persist-credentials: false
      # Contract rule 3: the dynamic versioning backend derives the version
      # from the newest reachable `v*` tag, so tagging HEAD locally is what makes
      # these artifacts carry `inputs.version`. The tag itself is pushed only
      # after a successful upload, by the publish workflow.
      - name: Tag local checkout
        if: inputs.tag != ''
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: git tag "$TAG"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install JS build toolchain
        run: npm ci
      - name: Cross-compile the native core (zig)
        if: matrix.zig
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: |
          uv tool install cargo-zigbuild
          uv tool run cargo-zigbuild build --release --target ${{ matrix.zigtarget }}
      - name: Compile the native core
        if: ${{ !matrix.zig }}
        env:
          # macOS min-version floor for the produced Mach-O; empty (Windows
          # entries have no deployment key) is ignored by the MSVC toolchain.
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment }}
        run: cargo build --release --target ${{ matrix.target }}
      - name: Build the platform wheel
        shell: bash
        env:
          # The core is prebuilt above; the hook packs it and stamps the
          # platform tag, and builds the render client (node) into the wheel.
          # The client is required by default; REQUIRE_CARGO also forbids the
          # core from silently going missing.
          XY_REQUIRE_CARGO: "1"
          XY_SKIP_CARGO: "1"
          XY_CARGO_TARGET: ${{ matrix.target }}
          XY_WHEEL_PLATFORM: ${{ matrix.plat }}
        run: uv build --wheel
      - name: Verify wheel contents
        shell: bash
        run: |
          whl=$(ls dist/*.whl)
          python scripts/verify_wheel.py "$whl" --expect-native
      - name: Install-size budget (<= 15 MB)
        shell: bash
        run: |
          whl=$(ls dist/*.whl)
          size=$(wc -c < "$whl" | tr -d ' ')
          echo "wheel size: $size bytes ($whl)"
          test "$size" -le 15728640
      - name: Verify the wheel installs and loads the native core
        # Only host-arch wheels can be imported on the runner; cross-compiled
        # arches (aarch64/armv7/win-arm64/win32) are content-verified instead.
        if: matrix.native
        shell: bash
        run: |
          uv venv smoke
          uv pip install -p smoke dist/*.whl numpy anywidget "reflex>=0.9.6"
          ./smoke/bin/python -c "import importlib.metadata as m, reflex_xy, xy.kernels as k; assert k.BACKEND=='native', k.BACKEND; assert reflex_xy.__version__ == m.version('xy'); print('native', k.__file__)" \
            || ./smoke/Scripts/python.exe -c "import importlib.metadata as m, reflex_xy, xy.kernels as k; assert k.BACKEND=='native', k.BACKEND; assert reflex_xy.__version__ == m.version('xy'); print('native')"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-prefix }}${{ matrix.plat }}
          path: dist/*.whl

  # PyEmscripten WASM wheel for in-browser CPython. The platform ABI is
  # compiler-sensitive, so keep Rust, Emscripten, cibuildwheel, the wheel tag,
  # and the runtime probe pinned as one tested set
  # (see spec/process/production-readiness.md).

  wasm:
    name: Wheel PyEmscripten (runtime verified)
    needs: version-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags: the distribution version is derived from the
          # latest `v*` tag, and a shallow clone has none.
          fetch-depth: 0
          persist-credentials: false
      - name: Tag local checkout
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
        run: git tag "$TAG"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.97.0
          targets: wasm32-unknown-emscripten
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install JS build toolchain
        run: npm ci
      # cibuildwheel installs the Pyodide 314 cross-environment and its patched
      # Emscripten 5.0.3 toolchain before CIBW_BEFORE_BUILD_PYODIDE runs. Build
      # the standalone Rust cdylib there, then tell the Hatch hook to package
      # that prebuilt artifact rather than invoke Cargo a second time.
      - name: Build the PyEmscripten wheel
        uses: pypa/cibuildwheel@294735312765b09d24a2fbec22660ce817587d55 # v4.1.0
        env:
          CIBW_PLATFORM: pyodide
          CIBW_BUILD: cp314-pyodide_wasm32
          CIBW_PYODIDE_VERSION: "314.0.0"
          CIBW_BEFORE_BUILD_PYODIDE: >-
            cargo build --release --target wasm32-unknown-emscripten
          CIBW_ENVIRONMENT_PYODIDE: >-
            XY_REQUIRE_CARGO=1
            XY_SKIP_CARGO=1
            XY_CARGO_TARGET=wasm32-unknown-emscripten
            XY_WHEEL_PLATFORM=pyemscripten_2026_0_wasm32
            RUSTFLAGS="-C panic=abort"
      - name: Verify wheel contents
        shell: bash
        run: |
          whl=$(ls wheelhouse/*.whl)
          python scripts/verify_wheel.py "$whl" --expect-native
      # "Builds" is not "loads": install the exact wheel in a real Pyodide 314
      # runtime and call both the C ABI version function and a native kernel.
      - name: PyEmscripten runtime load probe
        run: |
          npm i --no-save pyodide@314.0.0
          whl=$(ls wheelhouse/*.whl)
          python scripts/pyodide_load_smoke.py "$whl"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # PEP 783 makes pyemscripten_* a standard PyPI platform tag. Keeping
          # this in the dist-* namespace includes it in the trusted-publishing
          # batch alongside the native wheels and sdist.
          name: ${{ inputs.artifact-prefix }}pyemscripten
          path: wheelhouse/*.whl

  sdist:
    name: sdist
    needs: version-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags: the distribution version is derived from the
          # latest `v*` tag, and a shallow clone has none.
          fetch-depth: 0
          persist-credentials: false
      - name: Tag local checkout
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
        run: git tag "$TAG"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      # The build hook builds the render client (node) into the sdist, so
      # `pip install <sdist>` needs no Node. It builds the Rust core on the
      # user's machine when a toolchain is present. The smoke below requires
      # that build and proves the installed native backend loads successfully.
      - name: Install JS build toolchain
        run: npm ci
      - name: Build sdist
        # The client is required by default, so a published sdist always carries
        # the prebuilt render client (the build fails otherwise).
        run: uv build --sdist
      - name: Verify sdist contents
        shell: bash
        run: |
          sdist=$(ls dist/*.tar.gz)
          python scripts/verify_sdist.py "$sdist"
      - name: Build and load native core from sdist
        shell: bash
        env:
          XY_REQUIRE_CARGO: "1"
        run: |
          uv venv smoke-native
          uv pip install --no-cache -p smoke-native dist/*.tar.gz numpy anywidget "reflex>=0.9.6"
          ./smoke-native/bin/python - <<'PY'
          import importlib.metadata as metadata

          import reflex_xy
          import xy
          import xy.kernels as kernels

          version = metadata.version("xy")
          assert xy.__version__ == version
          assert reflex_xy.__version__ == version
          assert kernels.BACKEND == "native", kernels.BACKEND
          print("sdist built and loaded the native Rust core")
          PY
      - name: Verify coreless sdist imports reflex_xy
        shell: bash
        env:
          XY_SKIP_CARGO: "1"
        run: |
          uv venv smoke-no-rust
          uv pip install --no-cache -p smoke-no-rust dist/*.tar.gz numpy anywidget "reflex>=0.9.6"
          ./smoke-no-rust/bin/python - <<'PY'
          import importlib.metadata as metadata

          import reflex_xy
          import xy

          version = metadata.version("xy")
          assert xy.__version__ == version
          assert reflex_xy.__version__ == version
          try:
              import xy.kernels  # noqa: F401
          except ImportError as err:
              msg = str(err)
              assert "native Rust core" in msg, msg
              assert "rustup.rs" in msg, msg
              print("coreless sdist imports reflex_xy and errors clearly on compute")
          else:
              raise SystemExit("expected ImportError without the native core")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-prefix }}sdist
          path: dist/*.tar.gz

  # Merge the matrix output into the single artifact the gated job uploads, and
  # re-verify it as a batch: `verify-dist` fails unless *every* artifact — all
  # eleven wheels, the wasm wheel and the sdist — declares the version being
  # released, which is what catches a build that silently fell back to the
  # derived development version.
