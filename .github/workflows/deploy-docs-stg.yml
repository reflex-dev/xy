# Build one versioned image pair, deploy it to staging, wait for production
# approval, then promote the exact same images to production.

name: Deploy XY Docs to Stage and Prod

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Existing XY release tag (semver, for example v0.1.0)"
        required: true
        type: string
  push:
    # The library's semver release tags — the same `v*` tags release.yml
    # publishes to PyPI from, so the docs site ships the version it documents.
    # Deploying an arbitrary commit outside a release is workflow_dispatch's
    # job (or deploy-docs-dev.yml, which tracks main on every push).
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: deploy-xy-docs-stg
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
    steps:
      - name: Resolve version and source commit
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          # Shape check only — the real gate (tag == pyproject == CHANGELOG)
          # runs below against the tagged tree. Deliberately PEP 440, not
          # strict SemVer: release.yml requires tag == "v" + the pyproject
          # version, so an rc tags as `v0.2.0rc1` (no dash) and a post-release
          # as `v0.2.0.post1`. Local versions are excluded because `+` is not a
          # legal Docker tag character and this value becomes the image tag,
          # and the trailing class cannot end in a separator. 128 chars is the
          # ceiling the reusable build/helm workflows enforce.
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-]?[A-Za-z0-9]+)*$ ]]; then
            echo "::error::version must be a release tag like v0.1.0, v0.2.0rc1 or v0.2.0.post1"
            exit 1
          fi
          if (( ${#VERSION} > 128 )); then
            echo "::error::version must be <=128 characters (Docker tag limit)"
            exit 1
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            SHA=$(gh api "repos/${REPO}/commits/${VERSION}" --jq '.sha')
          else
            SHA="$EVENT_SHA"
          fi
          if [[ ! "$SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::resolved SHA is not a 40-character hex commit"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SHA" >> "$GITHUB_OUTPUT"

      # A semver-shaped tag is not necessarily a releasable one. Run the same
      # gate release.yml runs, against the tagged tree, so a stray `v9.9.9`
      # cannot deploy docs for a library version that can never be published.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.resolve.outputs.source_sha }}
          persist-credentials: false
      - name: Release version gate (tag == pyproject == CHANGELOG)
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: python3 scripts/check_release_version.py --tag "$VERSION"

  build:
    name: Build Versioned Images
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/_build-docs-images.yml
    with:
      image_tag: ${{ needs.prepare.outputs.version }}
      source_ref: ${{ needs.prepare.outputs.source_sha }}
    secrets: inherit

  helm-pr-stg:
    name: Update Staging Helm Values
    needs: [prepare, build]
    permissions:
      contents: read
    uses: ./.github/workflows/_helm-docs-pr.yml
    with:
      image_tag: ${{ needs.prepare.outputs.version }}
      environment: stg
      source_ref: ${{ needs.prepare.outputs.source_sha }}
      auto_merge: true
    secrets: inherit

  await-prod-approval:
    name: Await Production Approval
    needs: helm-pr-stg
    runs-on: ubuntu-latest
    timeout-minutes: 720
    environment: production
    permissions:
      contents: read
    steps:
      - run: echo "Approved for production promotion"

  # No GitHub Release job here: on a `v*` tag release.yml owns the release
  # (it gates tag == pyproject == CHANGELOG and attaches every verified wheel
  # and sdist with generated notes). A second creator would race it and could
  # win, stamping a library release with docs-deployment notes. The flip side
  # of not owning it is that this workflow must confirm it happened before
  # promoting prod.
  verify-library-release:
    name: Verify Library Release Published
    needs: [prepare, await-prod-approval]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      attestations: read
    steps:
      # release.yml runs in parallel on the same tag and its wheel matrix is
      # slow, so poll rather than sample once. Prod must never document a
      # version users cannot `pip install`.
      - name: Await GitHub Release and PyPI availability
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          PYPI_VERSION="${VERSION#v}"
          PROVENANCE_NAME="xy-release-provenance.json"
          EXPECTED_PRERELEASE=false
          if [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(a|b|rc)[0-9]+$ ]]; then
            EXPECTED_PRERELEASE=true
          fi
          for attempt in $(seq 1 30); do
            RELEASED=false
            PUBLISHED=false
            PROVENANCE_VALID=false
            ASSETS_MATCH=false
            if release_json="$(
              gh release view "$VERSION" \
                --repo "$REPO" \
                --json assets,body,isDraft,isPrerelease,name,publishedAt,tagName 2>/dev/null
            )"; then
              if jq -e \
                --arg name "$VERSION" \
                --argjson prerelease "$EXPECTED_PRERELEASE" \
                '.isDraft == false and
                 .name == $name and
                 .tagName == $name and
                 .publishedAt != null and
                 .isPrerelease == $prerelease and
                 any(.assets[]?; .name | endswith(".whl")) and
                 ([.assets[]? | select(.name | endswith(".tar.gz"))] | length) == 1 and
                 ([.assets[]? | select(.name == "xy-release-provenance.json")] |
                   length) == 1' \
                <<<"$release_json" >/dev/null; then
                RELEASED=true
              fi
            fi
            if pypi_json="$(
              curl -fsS "https://pypi.org/pypi/xy/${PYPI_VERSION}/json" 2>/dev/null
            )"; then
              # A yank is a withdrawal signal, not a usable release. Reject
              # the entire version if any uploaded file has been yanked.
              if jq -e \
                '(.urls | length > 1) and
                 all(.urls[]; .yanked == false) and
                 any(.urls[]; .filename | endswith(".whl")) and
                 ([.urls[] | select(.filename | endswith(".tar.gz"))] |
                   length) == 1' \
                <<<"$pypi_json" >/dev/null; then
                PUBLISHED=true
              fi
            fi
            if [[ "$RELEASED" == true && "$PUBLISHED" == true ]]; then
              verify_dir="$(mktemp -d "${RUNNER_TEMP}/xy-promotion-verify.XXXXXX")"
              if gh release download "$VERSION" \
                --repo "$REPO" \
                --dir "$verify_dir" \
                --pattern '*.whl' \
                --pattern '*.tar.gz' \
                --pattern "$PROVENANCE_NAME"; then
                provenance_file="${verify_dir}/${PROVENANCE_NAME}"
                if [[ -s "$provenance_file" ]] &&
                   gh attestation verify "$provenance_file" \
                     --repo "$REPO" \
                     --signer-workflow "${REPO}/.github/workflows/release.yml" \
                     --source-ref "refs/tags/${VERSION}" \
                     --source-digest "$SOURCE_SHA" \
                     --deny-self-hosted-runners >/dev/null &&
                   jq -e \
                     --arg tag "$VERSION" \
                     --arg source_sha "$SOURCE_SHA" \
                     '.schema == "xy-release-provenance/v1" and
                      .tag == $tag and
                      .source_sha == $source_sha and
                      (.release_notes_sha256 |
                        test("^[0-9a-f]{64}$")) and
                      (.distributions | type == "array" and length > 1) and
                      ([.distributions[].name] | length) ==
                        ([.distributions[].name] | unique | length) and
                      all(.distributions[];
                        (.name |
                          endswith(".whl") or endswith(".tar.gz")) and
                        (.sha256 | test("^[0-9a-f]{64}$")))' \
                     "$provenance_file" >/dev/null; then
                  manifest_sha256="$(
                    sha256sum "$provenance_file" | cut -d ' ' -f 1
                  )"
                  footer="<!-- xy-release-provenance:v1:${VERSION}:sha256:${manifest_sha256} -->"
                  release_notes="$(jq -r '.body // ""' <<<"$release_json")"
                  if [[ "$release_notes" == *$'\n\n'"$footer" ]]; then
                    notes_body="${release_notes%$'\n\n'"$footer"}"
                    actual_notes_sha256="$(
                      printf '%s' "$notes_body" |
                        sha256sum |
                        cut -d ' ' -f 1
                    )"
                    manifest_notes_sha256="$(
                      jq -r '.release_notes_sha256' "$provenance_file"
                    )"
                    if [[ "$actual_notes_sha256" == "$manifest_notes_sha256" ]]; then
                      PROVENANCE_VALID=true
                    fi
                  fi
                fi

                if [[ "$PROVENANCE_VALID" == true ]]; then
                  github_hashes_json="$(
                    for artifact in "$verify_dir"/*.whl "$verify_dir"/*.tar.gz; do
                      artifact_sha256="$(
                        sha256sum "$artifact" | cut -d ' ' -f 1
                      )"
                      jq -cn \
                        --arg name "${artifact##*/}" \
                        --arg sha256 "$artifact_sha256" \
                        '{name: $name, sha256: $sha256}'
                    done | jq -sc 'sort_by(.name)'
                  )"
                  manifest_hashes_json="$(
                    jq -c \
                      '[.distributions[] | {name, sha256}] | sort_by(.name)' \
                      "$provenance_file"
                  )"
                  pypi_hashes_json="$(
                    jq -c \
                      '[.urls[] |
                        select(.filename |
                          endswith(".whl") or endswith(".tar.gz")) |
                        {name: .filename, sha256: .digests.sha256}] |
                       sort_by(.name)' \
                      <<<"$pypi_json"
                  )"
                  if jq -e \
                       'length > 1 and
                        ([.[].name] | length) ==
                          ([.[].name] | unique | length) and
                        all(.[]; .sha256 |
                          type == "string" and
                          test("^[0-9a-f]{64}$"))' \
                       <<<"$pypi_hashes_json" >/dev/null &&
                     [[ "$github_hashes_json" == "$manifest_hashes_json" &&
                        "$github_hashes_json" == "$pypi_hashes_json" ]]; then
                    ASSETS_MATCH=true
                  fi
                fi
              fi
              # A failed candidate can be retried up to 30 times. Remove the
              # downloaded wheel set before polling again to bound disk use.
              rm -rf -- "$verify_dir"
            fi
            if [[ "$RELEASED" == true &&
                  "$PUBLISHED" == true &&
                  "$PROVENANCE_VALID" == true &&
                  "$ASSETS_MATCH" == true ]]; then
              echo "::notice::${VERSION} has signed release provenance and byte-identical, non-yanked GitHub/PyPI distributions"
              exit 0
            fi
            echo "attempt ${attempt}/30 — release=${RELEASED} pypi=${PUBLISHED} provenance=${PROVENANCE_VALID} assets=${ASSETS_MATCH}; retrying in 60s"
            sleep 60
          done
          echo "::error::${VERSION} did not become release-ready (metadata, signed notes provenance, non-yanked PyPI files, or exact asset hashes missing/mismatched) — refusing to promote prod"
          exit 1

  helm-pr-prod:
    name: Update Production Helm Values
    needs: [prepare, await-prod-approval, verify-library-release]
    permissions:
      contents: read
    uses: ./.github/workflows/_helm-docs-pr.yml
    with:
      image_tag: ${{ needs.prepare.outputs.version }}
      environment: prod
      source_ref: ${{ needs.prepare.outputs.source_sha }}
      auto_merge: true
    secrets: inherit
