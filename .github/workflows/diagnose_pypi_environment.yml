name: Diagnose pypi environment gate

# TEMPORARY DIAGNOSTIC — delete this file once the release pipeline publishes.
#
# Round 1 established two things and ruled the environment out entirely:
#
#   * The pypi environment is configured correctly: required_reviewers, plus
#     custom branch policies for main, r/hotfix/* and r/pre-*. The release
#     branch r/pre-2026.08.25 matches r/pre-*.
#   * A ref the branch policy does NOT allow makes the job FAIL, with no logs
#     and no runner — not skip. The gate cannot produce a silent skip, so it
#     is not what skips publish.yml's upload.
#
# That leaves the job graph. publish.yml's `build` job is skipped by design
# whenever a package builds through `custom-build-*` instead, and `collect`
# tolerates that explicitly with `!cancelled() && !failure()`. But `publish`
# guards only on `needs.prepare.outputs.skipped != 'true'` — no status
# function — so it carries the implicit `success()` over its dependencies.
# This reproduces exactly that shape to find out whether the skip on `build`
# reaches `publish` through `collect`, and whether a status function stops it.

on:
  push:
    branches: ["claude/pypi-publish-skip-debug-iugo6u"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # publish.yml's `prepare`, reduced to the one output the guards read.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      skipped: ${{ steps.prepare.outputs.skipped }}
    steps:
      - id: prepare
        shell: bash
        run: echo "skipped=false" >> "$GITHUB_OUTPUT"

  # publish.yml's `build`, with the same guard that skips it for xy: the
  # package builds through the custom build workflow instead.
  build:
    needs: prepare
    if: >-
      needs.prepare.outputs.skipped != 'true'
      && !contains(fromJson('["xy"]'), 'xy')
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: echo "unreachable for a custom-build package"

  # publish.yml's `collect`, verbatim guard. Tolerates the skipped `build`.
  collect:
    needs: [prepare, build]
    if: >-
      !cancelled() && !failure() &&
      needs.prepare.outputs.skipped != 'true'
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: echo "collect ran, exactly as it does in the real release run"

  # publish.yml's `publish`, verbatim guard, minus the environment. If this is
  # skipped while `collect` succeeded, the skip propagated transitively from
  # `build` and the generated workflow is the bug.
  publish-as-generated:
    needs: [prepare, collect]
    if: needs.prepare.outputs.skipped != 'true'
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: echo "reached the upload step"

  # The same job with the status function `collect` already uses. If this runs
  # while the one above is skipped, that is the fix.
  publish-with-status-function:
    needs: [prepare, collect]
    if: >-
      !cancelled() && !failure() &&
      needs.prepare.outputs.skipped != 'true'
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: echo "reached the upload step"

  # publish.yml's `tag-and-release` carries no `if` at all. If the propagation
  # is transitive, the skipped `build` still reaches it even once `publish`
  # is fixed, and the upstream fix has to cover this job too.
  tag-and-release-as-generated:
    needs: [prepare, publish-with-status-function]
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: echo "pushed the tag"
